events {
    worker_connections 1024;
}

http {
    underscores_in_headers on;
    server_tokens off;
    client_max_body_size 10M;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    proxy_connect_timeout 5s;

    # Access logs stay active but never reconstruct an arbitrary request path.
    # Known routes map to fixed shapes; dynamic phone and numeric resource
    # segments are represented only by fixed markers. Unknown routes fail
    # closed to a single marker. Referer, User-Agent, Host and forwarded headers
    # are deliberately absent from the log format below.
    map $uri $privacy_path {
        default "[REDACTED_PATH]";
        "/" "/";
        "/health" "/health";
        # FU-4: fixed shapes only; never log arbitrary diagnostic suffixes.
        "/internal/health" "/internal/health";
        "/health/provider-auth" "/health/provider-auth";
        "/webhook" "/webhook";
        "/chatwoot/webhook" "/chatwoot/webhook";
        "/docs" "/docs";
        "/redoc" "/redoc";
        "/openapi.json" "/openapi.json";
        # FU-4: denied docs variants keep fixed shapes in privacy_safe.
        "/docs/" "/docs/";
        "/docs/oauth2-redirect" "/docs/oauth2-redirect";
        "/redoc/" "/redoc/";
        "/openapi.json/" "/openapi.json/";
        "~^/agentes/?$" "/agentes";
        "~^/agentes/[0-9]+$" "/agentes/[REDACTED_ID]";
        "~^/agentes/[0-9]+/consumo$" "/agentes/[REDACTED_ID]/consumo";
        "~^/atendentes/?$" "/atendentes";
        "~^/atendentes/[0-9]+$" "/atendentes/[REDACTED_ID]";
        "~^/sessoes/?$" "/sessoes";
        "~^/sessoes/[^/]+$" "/sessoes/[REDACTED_PHONE]";
        "~^/sessoes/[^/]+/transferir$" "/sessoes/[REDACTED_PHONE]/transferir";
        "~^/sessoes/[^/]+/retomar$" "/sessoes/[REDACTED_PHONE]/retomar";
        "~^/sessoes/[^/]+/historico$" "/sessoes/[REDACTED_PHONE]/historico";
        "/app" "/app";
        "/auth/sign_in" "/auth/sign_in";
        "/cable" "/cable";
        "~^/api/v1/accounts/[0-9]+/contacts/search$" "/api/v1/accounts/[REDACTED_ID]/contacts/search";
        "~^/api/v1/accounts/[0-9]+/contacts$" "/api/v1/accounts/[REDACTED_ID]/contacts";
        "~^/api/v1/accounts/[0-9]+/contacts/[0-9]+$" "/api/v1/accounts/[REDACTED_ID]/contacts/[REDACTED_ID]";
        "~^/api/v1/accounts/[0-9]+/conversations$" "/api/v1/accounts/[REDACTED_ID]/conversations";
        "~^/api/v1/accounts/[0-9]+/conversations/[0-9]+$" "/api/v1/accounts/[REDACTED_ID]/conversations/[REDACTED_ID]";
    }

    # A percent-encoded digit token that remains after Nginx normalization means
    # the client double-encoded at least part of the path. Reject any such token
    # before upstream routing; this covers full and mixed first/middle/last forms
    # without relying on phone length or reconstructing the value.
    map $uri $privacy_reject_encoded_digit {
        default 0;
        "~*%3[0-9]" 1;
    }

    map $arg_handler $privacy_query_handler {
        default "-";
        bot bot;
        humano humano;
        encerrada encerrada;
    }

    map $arg_status $privacy_query_status {
        default "-";
        active active;
        inactive inactive;
        open open;
        closed closed;
        pending pending;
        resolved resolved;
    }

    map $arg_page $privacy_query_page {
        default "-";
        "~^[0-9]{1,6}$" $arg_page;
    }

    map $arg_include_contacts $privacy_query_include_contacts {
        default "-";
        true true;
        false false;
    }

    map $arg_q $privacy_query_q {
        "" "-";
        default "[REDACTED_PHONE]";
    }

    map $arg_phone $privacy_query_phone {
        "" "-";
        default "[REDACTED_PHONE]";
    }

    map $arg_phone_number $privacy_query_phone_number {
        "" "-";
        default "[REDACTED_PHONE]";
    }

    map $arg_telefone $privacy_query_telefone {
        "" "-";
        default "[REDACTED_PHONE]";
    }

    log_format privacy_safe escape=json
        '$remote_addr method="$request_method" path="$privacy_path" '
        'query_handler="$privacy_query_handler" '
        'query_status="$privacy_query_status" '
        'query_page="$privacy_query_page" '
        'query_include_contacts="$privacy_query_include_contacts" '
        'query_q="$privacy_query_q" '
        'query_phone="$privacy_query_phone" '
        'query_phone_number="$privacy_query_phone_number" '
        'query_telefone="$privacy_query_telefone" '
        'protocol="$server_protocol" status=$status bytes=$body_bytes_sent '
        'request_time=$request_time upstream_status="$upstream_status" '
        'upstream_connect_time="$upstream_connect_time" '
        'upstream_response_time="$upstream_response_time"';

    access_log /var/log/nginx/access.log privacy_safe;

    # Ordinary upstream failures can include the raw request line in Nginx's
    # error log. Keep only critical process-level errors here; request outcome
    # and timing remain available in the privacy-safe access log above.
    error_log /var/log/nginx/error.log crit;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # FastAPI app
    server {
        listen 80;
        server_name localhost;

        if ($privacy_reject_encoded_digit) {
            return 400;
        }

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # F0-T4: exact public allowlist; all other app paths fail closed.
        location = / {
            if ($request_method !~ "^(GET|HEAD)$") { return 405; }
            set                $app_upstream app:5000;
            proxy_pass         http://$app_upstream/$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location = /health {
            if ($request_method !~ "^(GET|HEAD)$") { return 405; }
            set                $app_upstream app:5000;
            proxy_pass         http://$app_upstream/health$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location = /webhook {
            if ($request_method != POST) { return 405; }
            set                $app_upstream app:5000;
            proxy_pass         http://$app_upstream/webhook$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location = /chatwoot/webhook {
            if ($request_method != POST) { return 405; }
            set                $app_upstream app:5000;
            proxy_pass         http://$app_upstream/chatwoot/webhook$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location / { return 404; }

    }

    # Evolution API
    server {
        listen 80;
        server_name evolution.localhost;

        if ($privacy_reject_encoded_digit) {
            return 400;
        }

        location / {
            set                $evolution_upstream evolution:8080;
            proxy_pass         http://$evolution_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
        }
    }

    # Evolution manager (local fallback)
    server {
        listen 80;
        server_name painel.localhost;

        if ($privacy_reject_encoded_digit) {
            return 400;
        }

        location / {
            set                $frontend_upstream frontend:80;
            proxy_pass         http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

        # Chatwoot
    server {
        listen 80;
        server_name chatwoot.localhost;

        if ($privacy_reject_encoded_digit) {
            return 400;
        }

        location / {
            set                $chatwoot_upstream chatwoot:3000;
            proxy_pass         http://$chatwoot_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_read_timeout 300s;
        }
    }

    
    server {
        listen 80 default_server;
        server_name _;
        return 404 "Host not configured for local development\n";
    }
}
